name: Parallel Cypress Tests

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Cypress Cloud Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        machine: [1, 2, 3, 4, 5]
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Run Cypress
        run: |
          for i in {1..50}; do
            docker run -e CYPRESS_RECORD_KEY=$CYPRESS_RECORD_KEY -e GITHUB_TOKEN=$GITHUB_TOKEN cypress/base:13.6.0
          done
        env:
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
